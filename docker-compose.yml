services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiptop
      POSTGRES_PASSWORD: tiptop
      POSTGRES_DB: tiptop
    ports:
      - "5432:5432"
    volumes:
      - tiptop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiptop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  tiptop_pg:
