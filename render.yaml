# Blueprint Render — le code est sur main.
# URL : https://tiptop-phone.onrender.com
#
# Si « create web service failed » : Dashboard → supprimer tiptop-phone,
# tiptop-cesar99 et le Postgres free tiptop-db, puis New → Blueprint → main.

databases:
  - name: tiptop-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: tiptop
    user: tiptop

services:
  - type: web
    runtime: node
    name: tiptop-phone
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: WEB_PORT
        value: "3000"
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:3001
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: OTP_ALLOW_MOCK
        value: "1"
      - key: OTP_MOCK_CODE
        value: "1234"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tiptop-db
          property: connectionString
