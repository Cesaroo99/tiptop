# Blueprint Render — code sur main. Runtime Docker (build fiable, health immédiat).
# URL : https://tiptop-phone.onrender.com
#
# Le web est en Starter (always-on) : le plan Free s’endort après 15 min
# et affiche « TipTop se réveille ». Starter reste allumé en continu.
#
# Si create/deploy échoue : supprimer tiptop-phone, tiptop-cesar99, tiptop-db
# et l’ancien Blueprint, puis New → Blueprint → main.

databases:
  - name: tiptop-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: tiptop
    user: tiptop

services:
  - type: web
    runtime: docker
    name: tiptop-phone
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: WEB_PORT
        value: "3000"
      - key: API_INTERNAL_URL
        value: http://127.0.0.1:3001
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: OTP_ALLOW_MOCK
        value: "1"
      - key: OTP_MOCK_CODE
        value: "1234"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tiptop-db
          property: connectionString
